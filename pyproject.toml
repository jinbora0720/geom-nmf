[project]
name = "geom-nmf"
version = "0.1.0"
description = "Geometric non-negative matrix factorization (GeomNMF) via maximum-volume simplex fitting."
authors = [
    { name = "Bora Jin", email = "jinbora0720@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.9"
keywords = [
    "nmf",
    "non-negative matrix factorization",
    "source apportionment",
    "endmember extraction",
    "simplex",
    "unmixing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "scikit-learn>=1.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
progress = ["tqdm>=4.60"]
all = ["matplotlib>=3.5", "tqdm>=4.60"]

[project.urls]
Homepage = "https://github.com/jinbora0720/geom-nmf"
Repository = "https://github.com/jinbora0720/geom-nmf"
Documentation = "https://github.com/jinbora0720/geom-nmf/tree/main/docs"
"Bug Tracker" = "https://github.com/jinbora0720/geom-nmf/issues"
Changelog = "https://github.com/jinbora0720/geom-nmf/blob/main/CHANGELOG.md"

[tool.poetry]
packages = [{ include = "geom_nmf", from = "src" }]

# Locking hints only (published metadata comes from [project].dependencies).
# Without these, Poetry may lock a single old release for every Python version,
# which has no prebuilt wheels on newer interpreters.
[tool.poetry.dependencies]
numpy = [
    { version = ">=1.21", python = "<3.10" },
    { version = ">=2.1", python = ">=3.10" },
]
scipy = [
    { version = ">=1.7", python = "<3.10" },
    { version = ">=1.14.1", python = ">=3.10" },
]
scikit-learn = [
    { version = ">=1.0", python = "<3.10" },
    { version = ">=1.5.2", python = ">=3.10" },
]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.1"
matplotlib = ">=3.5"
tqdm = ">=4.60"
pandas = ">=1.3"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = ">=7.0"

[tool.poetry.group.coverage]
optional = true

[tool.poetry.group.coverage.dependencies]
pytest-cov = ">=4.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "error::DeprecationWarning:geom_nmf.*",
]

[tool.coverage.run]
source = ["geom_nmf"]
branch = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
